services:
  dsh:
    image: node:24-bookworm-slim
    container_name: dsh
    restart: unless-stopped
    # O DSH exige loopback por segurança. Com a rede do host, 127.0.0.1:3080
    # continua privado e o Caddy local consegue encaminhar para ele.
    network_mode: host
    volumes:
      - ${HOMELAB_DATA_ROOT}/services/dsh:/data
    environment:
      DSH_HOME: /data/state
      NPM_CONFIG_CACHE: /data/npm-cache
      # Aponta ao modelo ROCm do desk pela rede NetBird.
      DSH_LLM_BASE_URL: ${DSH_LLM_BASE_URL}
      DSH_LLM_MODEL: ${DSH_LLM_MODEL}
    command:
      - sh
      - -c
      - |
        mkdir -p /data/state /data/workspace /data/npm-cache
        cd /data/workspace
        exec npx --yes --loglevel=http @deepseek-ai/dsh@0.1.0-rc.7 web --trusted-host dsh.rafh.io --no-open
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3080/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
