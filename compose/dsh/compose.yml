services:
  dsh:
    image: node:22
    container_name: dsh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ${HOMELAB_DATA_ROOT}/services/dsh:/home/node
    environment:
      # Apunta ao modelo ROCm do desk (via NetBird), non ao modelo local do server
      DSH_LLM_BASE_URL: ${DSH_LLM_BASE_URL}
      DSH_LLM_MODEL: ${DSH_LLM_MODEL}
    command:
      - npx
      - --yes
      - "@deepseek-ai/dsh@0.1.0-rc.7"
      - web
      - --no-open
