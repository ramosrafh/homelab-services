services:
  qwen-server:
    image: ${LLAMA_SERVER_IMAGE:-ghcr.io/ggerganov/llama.cpp:server-rocm}
    container_name: qwen-ai-server
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ${QWEN_MODELS_DIR}:/models:ro
    ports:
      - "8080:8080"
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
    command:
      - --model
      - /models/${QWEN_MODEL_FILE}
      - --alias
      - ${QWEN_MODEL_ID}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --gpu-layers
      - "999"
      - --ctx-size
      - ${QWEN_CONTEXT_SIZE:-8192}
      - --flash-attn
      - on
      - --jinja
