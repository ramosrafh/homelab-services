services:
  qwen-server:
    image: ${LLAMA_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm}
    container_name: qwen-ai-server
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ${QWEN_MODELS_DIR}:/models:ro
      - ./models.ini:/config/models.ini:ro
    ports:
      - "8080:8080"
    environment:
      HSA_OVERRIDE_GFX_VERSION: "11.0.0"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --models-preset
      - /config/models.ini
      # The RX 7800 XT cannot keep both 27B variants resident at once.
      - --models-max
      - "1"
